# =============================================================================
# REFERENCE COPY ONLY - this file is not deployed and nginx never reads it.
#
# The live config is on the server at:
#     /etc/nginx/sites-enabled/invoqs
#
# Changes are always made there directly (nano or scp), never by pushing this
# file. Nothing in the deploy scripts or GitHub Actions touches it.
#
# This copy exists so the config is not lost if the server is rebuilt, and so
# it can be reviewed without SSH access. To restore, copy the contents up to
# the path above, then:
#     nginx -t && systemctl reload nginx
#
# IMPORTANT: if you edit nginx on the server, update this file to match.
# There is nothing keeping the two in sync automatically, so they drift
# silently.
#
# Last verified against the server: 20 September 2026
#
# Note the Blazor blocks (invoqs.com, staging.invoqs.com) use
# 'Connection "upgrade"' so Blazor Server can use WebSockets. With
# 'keep-alive' it falls back to SignalR long-polling, exhausts the .NET
# thread pool under load, and the site 502s intermittently. That was the
# 9 September 2026 outage. The API, pgAdmin and Seq blocks are plain REST
# and correctly keep 'keep-alive'.
# =============================================================================

server {
    server_name api.invoqs.com;

    location / {
        proxy_pass http://localhost:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/invoqs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invoqs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Blazor Production
